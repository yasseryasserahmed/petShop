version: "3.9"

services:
  owner-db:
    image: postgres:16-alpine
    container_name: owner-db
    environment:
      POSTGRES_DB: owner_db
      POSTGRES_USER: owner_user
      POSTGRES_PASSWORD: owner_pass
    ports:
      - "5433:5432"
    volumes:
      - owner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner_user -d owner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  owner-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: owner-service
    depends_on:
      owner-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://owner-db:5432/owner_db
      SPRING_DATASOURCE_USERNAME: owner_user
      SPRING_DATASOURCE_PASSWORD: owner_pass
    ports:
      - "8081:8081"

volumes:
  owner_db_data:
