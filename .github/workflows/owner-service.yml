name: owner-service CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'owner-service/**'
      - '.github/workflows/owner-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'owner-service/**'
      - '.github/workflows/owner-service.yml'

defaults:
  run:
    working-directory: owner-service

env:
  IMAGE_NAME: owner-service

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests (unit + Testcontainers integration)
        run: mvn -B clean verify #run the junit 

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-service-test-results
          path: owner-service/target/surefire-reports

      - name: Build jar
        run: mvn -B package -DskipTests 

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: owner-service-jar
          path: owner-service/target/*.jar

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Only build/push a real image on main — develop is test-only for now,
    # since there's no dev environment to deploy it to yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest